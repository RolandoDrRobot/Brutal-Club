<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance hints -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Fight Club - Character Customization and Battle Application" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fight Club" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo.jpg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- DNS prefetch para recursos externos -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <!-- Preconnect para recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload fuentes críticas con display swap para mejor performance -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Anton&family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"></noscript>
    
    <!-- Preload assets críticos para reducir CLS -->
    <link rel="preload" href="/src/assets/optimized/coin.webp" as="image" importance="high">
    <link rel="preload" href="/src/assets/optimized/home.webp" as="image" importance="high">
    <link rel="preload" href="/src/assets/optimized/statCoin.webp" as="image" importance="high">
    <link rel="preload" href="/src/assets/optimized/button1.webp" as="image" importance="high">
    <link rel="preload" href="/src/assets/optimized/button2.webp" as="image" importance="high">
    <link rel="prefetch" href="/src/assets/optimized/punch.webp" as="image">
    <link rel="prefetch" href="/src/assets/optimized/kick.webp" as="image">
    <link rel="prefetch" href="/src/assets/optimized/combo.webp" as="image">
    <link rel="prefetch" href="/src/assets/optimized/pack.webp" as="image">
    <link rel="prefetch" href="/src/assets/optimized/coverbg.webp" as="image">
    
    <!-- Critical CSS inline para evitar FOUC -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000000 !important;
        background: #000000 !important;
        color: #F5F5DC;
        font-family: 'Anton', 'Impact', sans-serif;
        font-display: swap;
      }
      
      * {
        box-sizing: border-box;
      }
      
      #root {
        background-color: #000000 !important;
        background: #000000 !important;
        min-height: 100dvh;
        width: 100%;
        position: relative;
      }
      
      /* Loading skeleton para evitar layout shift */
      .app-skeleton {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .skeleton-loader {
        color: #F5F5DC;
        font-family: 'Anton', 'Impact', sans-serif;
        font-size: 18px;
        opacity: 0.8;
        animation: pulse 1.5s ease-in-out infinite alternate;
      }
      
      @keyframes pulse {
        from { opacity: 0.4; }
        to { opacity: 0.8; }
      }
      
      /* Optimización para evitar reflow */
      img {
        max-width: 100%;
        height: auto;
      }
      
      /* Smooth font rendering */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeSpeed;
      }
    </style>
    
    <title>Fight Club</title>
  </head>
  <body style="background-color: #000000 !important; background: #000000 !important; margin: 0; padding: 0;">
    <!-- Skeleton loader inicial -->
    <div id="app-skeleton" class="app-skeleton">
      <div class="skeleton-loader">starting Fight Club...</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Script para ocultar skeleton cuando React está listo -->
    <script>
      // Ocultar skeleton cuando React monte
      document.addEventListener('DOMContentLoaded', () => {
        const skeleton = document.getElementById('app-skeleton');
        const root = document.getElementById('root');
        
        let hasRemoved = false;
        
        const removeSkeleton = () => {
          if (hasRemoved || !skeleton.parentNode) return;
          hasRemoved = true;
          skeleton.style.opacity = '0';
          skeleton.style.transition = 'opacity 0.3s ease-out';
          setTimeout(() => {
            if (skeleton.parentNode) skeleton.remove();
          }, 300);
        };
        
        // Observer para detectar cuando React renderiza
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
              // Check if any added node is a React component (has data-reactroot or children)
              for (const node of mutation.addedNodes) {
                if (node.nodeType === Node.ELEMENT_NODE && 
                    (node.hasAttribute('data-reactroot') || node.children.length > 0)) {
                  console.log('React app detected, removing skeleton');
                  removeSkeleton();
                  observer.disconnect();
                  return;
                }
              }
            }
          }
          
          // Fallback: if root has any children, assume React has rendered
          if (root.children.length > 0) {
            console.log('React content detected, removing skeleton');
            removeSkeleton();
            observer.disconnect();
          }
        });
        
        observer.observe(root, { childList: true, subtree: true });
        
        // Fallback timeout más corto
        setTimeout(() => {
          console.log('Timeout reached, removing skeleton');
          removeSkeleton();
        }, 2000);
        
        // Additional check for immediate content
        if (root.children.length > 0) {
          console.log('Immediate React content detected');
          removeSkeleton();
        }
      });
    </script>
    
    <!-- PWA Service Worker Registration optimizado -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', {
            scope: '/',
            updateViaCache: 'imports'
          })
            .then((registration) => {
              console.log('SW registered: ', registration);
              // Check for updates
              registration.addEventListener('updatefound', () => {
                console.log('New SW version available');
              });
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
